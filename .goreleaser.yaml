version: 2
project_name: vk-music-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: vktui
    binary: vktui
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: "386" }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: "386" }
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # stable names so install scripts can use /releases/latest/download/...
    name_template: "vk-music-tui_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - packaging/linux/vk-music-tui.desktop
      - packaging/icons/vk-music-tui-256.png

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    package_name: vk-music-tui
    file_name_template: "vk-music-tui_{{ .Version }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    homepage: https://github.com/vildangil/vk-music-tui
    maintainer: vildangil
    description: |-
      Лёгкий консольный плеер VK Музыки в стиле Spotify.
      Lightweight terminal VK Music player (Spotify-like TUI).
    license: MIT
    section: sound
    formats: [deb, rpm, apk, archlinux]
    dependencies: [mpv]
    contents:
      - src: packaging/linux/vk-music-tui.desktop
        dst: /usr/share/applications/vk-music-tui.desktop
      - src: LICENSE
        dst: /usr/share/licenses/vk-music-tui/LICENSE
      - src: packaging/icons/vk-music-tui-256.png
        dst: /usr/share/icons/hicolor/256x256/apps/vk-music-tui.png
      - src: packaging/icons/vk-music-tui-128.png
        dst: /usr/share/icons/hicolor/128x128/apps/vk-music-tui.png
      - src: packaging/icons/vk-music-tui-48.png
        dst: /usr/share/icons/hicolor/48x48/apps/vk-music-tui.png
      - src: packaging/icons/vk-music-tui-32.png
        dst: /usr/share/icons/hicolor/32x32/apps/vk-music-tui.png
    overrides:
      rpm:
        file_name_template: "{{ .ConventionalFileName }}"
      archlinux:
        file_name_template: "{{ .ConventionalFileName }}"
      apk:
        file_name_template: "{{ .ConventionalFileName }}"

changelog:
  sort: asc

release:
  name_template: "VK Music TUI {{ .Version }}"
  header: |
    Лёгкий консольный плеер VK Музыки в стиле Spotify. Команда для запуска — `vktui`.
    Для звука нужен [mpv](https://mpv.io) — установщики и пакеты ставят его сами.

    ## Скачать

